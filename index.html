<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>devtools</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --surface-hover: #18181b;
      --border: #1e1e22;
      --border-subtle: #161618;
      --text: #e4e4e7;
      --text-muted: #71717a;
      --text-dim: #52525b;
      --accent: #6d28d9;
      --accent-soft: #7c3aed15;
      --accent-glow: #7c3aed30;
      --green: #059669;
      --green-soft: #05966915;
      --blue: #2563eb;
      --blue-soft: #2563eb15;
      --radius: 8px;
      --radius-sm: 5px;
      --gradient-1: #7c3aed08;
      --gradient-2: #2563eb06;
      --gradient-3: #05966904;
      --modal-overlay: #00000080;
    }

    [data-theme="light"] {
      --bg: #f8f8fa;
      --surface: #ffffff;
      --surface-hover: #f0f0f3;
      --border: #e4e4e7;
      --border-subtle: #ebebee;
      --text: #18181b;
      --text-muted: #71717a;
      --text-dim: #a1a1aa;
      --accent: #7c3aed;
      --accent-soft: #7c3aed12;
      --accent-glow: #7c3aed20;
      --green-soft: #05966912;
      --blue-soft: #2563eb12;
      --gradient-1: #7c3aed10;
      --gradient-2: #2563eb08;
      --gradient-3: #05966906;
      --modal-overlay: #00000040;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 20%, var(--gradient-1), transparent),
        radial-gradient(ellipse 60% 80% at 80% 80%, var(--gradient-2), transparent),
        radial-gradient(ellipse 70% 50% at 50% 50%, var(--gradient-3), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .topbar, .layout { position: relative; z-index: 1; }

    .theme-toggle {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s;
    }

    .theme-toggle:hover {
      border-color: #7c3aed40;
      color: var(--text);
    }

    /* Top bar */
    .topbar {
      height: 48px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--surface);
      gap: 10px;
    }

    .topbar .logo {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.5px;
      color: var(--text);
    }

    .topbar .logo span {
      color: var(--accent);
    }

    .topbar .sep {
      width: 1px;
      height: 20px;
      background: var(--border);
    }

    .topbar .tagline {
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gh-status {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .gh-status.connected { color: #34d399; }

    .topbar-btn {
      padding: 4px 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
    }

    .topbar-btn:hover {
      border-color: #7c3aed40;
      color: var(--text);
    }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr;
      height: calc(100vh - 48px);
    }

    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel:last-child { border-right: none; }

    .panel-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-dim);
    }

    .panel-count {
      font-size: 10px;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .panel-body::-webkit-scrollbar { width: 4px; }
    .panel-body::-webkit-scrollbar-track { background: transparent; }
    .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Items */
    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      group: true;
      position: relative;
    }

    .item:hover { background: var(--surface-hover); }

    .item-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .item-icon.repo {
      background: var(--accent-soft);
      color: #a78bfa;
      border: 1px solid var(--accent-glow);
    }

    .item-icon.site {
      background: var(--green-soft);
      color: #34d399;
      border: 1px solid #05966930;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.success { background: #34d399; box-shadow: 0 0 6px #34d39960; }
    .status-dot.failure { background: #ef4444; box-shadow: 0 0 6px #ef444460; }
    .status-dot.pending { background: #f59e0b; box-shadow: 0 0 6px #f59e0b60; }
    .status-dot.neutral { background: #52525b; }
    .status-dot.none { background: var(--border); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .status-dot.pending { animation: pulse 2s ease-in-out infinite; }

    .status-label {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .item-info { flex: 1; min-width: 0; }

    .item-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-url {
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: 'JetBrains Mono', monospace;
    }

    .item-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .item:hover .item-actions { opacity: 1; }

    .item-btn {
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.15s;
    }

    .item-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* Add bar */
    .add-bar {
      padding: 8px;
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .add-input {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-input::placeholder { color: var(--text-dim); }
    .add-input:focus { border-color: #7c3aed40; }

    /* Prompt items */
    .prompt-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
      border: 1px solid transparent;
    }

    .prompt-item:hover {
      background: var(--surface-hover);
      border-color: var(--border);
    }

    .prompt-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .prompt-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
    }

    .prompt-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .prompt-item:hover .prompt-actions { opacity: 1; }

    .prompt-preview {
      font-size: 10.5px;
      color: var(--text-dim);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.6;
    }

    .copy-toast {
      font-size: 10px;
      color: #34d399;
      font-weight: 500;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 480px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px #00000060;
      transform: translateY(8px);
      transition: transform 0.2s;
    }

    .modal-overlay.active .modal { transform: translateY(0); }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 13px;
      font-weight: 600;
    }

    .modal-close {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
      border-radius: 4px;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-close:hover { background: var(--border); color: var(--text); }

    .modal-body { padding: 16px 20px; }

    .modal-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 6px;
      display: block;
    }

    .modal-input {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 12px;
      outline: none;
      margin-bottom: 14px;
      font-family: 'Inter', sans-serif;
    }

    .modal-textarea {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.7;
      outline: none;
      resize: vertical;
      min-height: 140px;
    }

    .modal-input:focus, .modal-textarea:focus { border-color: #7c3aed40; }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      color: var(--text);
      transition: all 0.15s;
    }

    .btn:hover { border-color: #7c3aed40; }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover { background: #5b21b6; }

    .btn-danger {
      background: transparent;
      border-color: #dc262620;
      color: #ef4444;
    }

    .btn-danger:hover { background: #dc262615; }

    /* Empty state */
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-dim);
      font-size: 11px;
      text-align: center;
      padding: 20px;
      line-height: 1.8;
    }

    /* Linked highlight */
    .item.linked-highlight {
      background: var(--accent-soft);
      border: 1px solid var(--accent-glow);
      border-radius: var(--radius-sm);
    }

    .link-indicator {
      font-size: 9px;
      color: var(--accent);
      font-family: 'JetBrains Mono', monospace;
      opacity: 0.6;
    }

    /* Setup button */
    .setup-btn {
      padding: 3px 8px;
      border: 1px solid #7c3aed40;
      background: var(--accent-soft);
      color: #a78bfa;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    .setup-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .setup-btn.loading {
      opacity: 0.5;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr;
      }
      .panel { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="logo"><span>&gt;</span> devtools</div>
    <div class="sep"></div>
    <div class="tagline">repos &middot; sites &middot; prompts</div>
    <div class="topbar-right">
      <span class="gh-status" id="gh-status"></span>
      <button class="topbar-btn" id="gh-btn" onclick="openTokenModal()">GitHub</button>
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">&#9790;</button>
    </div>
  </div>

  <div class="layout">
    <!-- Repos -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Repos</span>
        <span class="panel-count" id="repo-count">0</span>
      </div>
      <div class="panel-body" id="repo-list"></div>
      <div class="add-bar">
        <input class="add-input" id="repo-input" placeholder="Paste repo URL and press Enter" />
      </div>
    </div>

    <!-- Sites -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Sites</span>
        <span class="panel-count" id="site-count">0</span>
      </div>
      <div class="panel-body" id="site-list"></div>
      <div class="add-bar">
        <input class="add-input" id="site-input" placeholder="Paste site URL and press Enter" />
      </div>
    </div>

    <!-- Prompts -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Prompts</span>
        <span class="panel-count" id="prompt-count">0</span>
      </div>
      <div class="panel-body" id="prompt-list"></div>
      <div class="add-bar">
        <button class="btn btn-primary" style="width:100%" onclick="openPromptModal()">+ New Prompt</button>
      </div>
    </div>
  </div>

  <!-- Prompt Modal -->
  <div class="modal-overlay" id="prompt-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">New Prompt</span>
        <button class="modal-close" onclick="closePromptModal()">&times;</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Name</label>
        <input class="modal-input" id="prompt-name-input" placeholder="e.g. Code Review" />
        <label class="modal-label">Prompt</label>
        <textarea class="modal-textarea" id="prompt-text-input" placeholder="Enter your prompt text..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closePromptModal()">Cancel</button>
        <button class="btn btn-primary" id="modal-save-btn" onclick="savePrompt()">Save</button>
      </div>
    </div>
  </div>

  <!-- Token Modal -->
  <div class="modal-overlay" id="token-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">GitHub Connection</span>
        <button class="modal-close" onclick="closeTokenModal()">&times;</button>
      </div>
      <div class="modal-body">
        <label class="modal-label">Personal Access Token</label>
        <input class="modal-input" id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" style="font-family:'JetBrains Mono',monospace;font-size:11px" />
        <p style="font-size:10px;color:var(--text-dim);line-height:1.7;margin-top:-6px">
          Create a token at GitHub &rarr; Settings &rarr; Developer settings &rarr; Personal access tokens.<br>
          Needs <code style="background:var(--bg);padding:1px 4px;border-radius:3px">repo</code> scope to read workflow runs. Stored locally only.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" onclick="disconnectGitHub()" id="gh-disconnect-btn" style="display:none;margin-right:auto">Disconnect</button>
        <button class="btn" onclick="closeTokenModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveToken()">Connect</button>
      </div>
    </div>
  </div>

  <script>
    // State
    const state = {
      repos: JSON.parse(localStorage.getItem('dt_repos') || '[]'),
      sites: JSON.parse(localStorage.getItem('dt_sites') || '[]'),
      prompts: JSON.parse(localStorage.getItem('dt_prompts') || '[]'),
    };

    let editingPromptId = null;

    // GitHub token
    let ghToken = localStorage.getItem('dt_gh_token') || '';
    const actionStatuses = {}; // keyed by repo id

    function persist() {
      localStorage.setItem('dt_repos', JSON.stringify(state.repos));
      localStorage.setItem('dt_sites', JSON.stringify(state.sites));
      localStorage.setItem('dt_prompts', JSON.stringify(state.prompts));
    }

    // Helpers
    function extractName(url) {
      try {
        const u = new URL(url);
        const parts = u.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
        if (parts.length >= 2) return parts.slice(-2).join('/');
        if (parts.length === 1) return parts[0];
        return u.hostname;
      } catch {
        return url;
      }
    }

    function extractDomain(url) {
      try { return new URL(url).hostname.replace('www.', ''); }
      catch { return url; }
    }

    function initials(name) {
      const parts = name.split('/');
      const last = parts[parts.length - 1];
      return last.substring(0, 2).toUpperCase();
    }

    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // Render repos
    function renderRepos() {
      const el = document.getElementById('repo-list');
      document.getElementById('repo-count').textContent = state.repos.length;

      if (!state.repos.length) {
        el.innerHTML = '<div class="empty">Paste a repo URL below<br>to get started</div>';
        return;
      }

      el.innerHTML = state.repos.map(r => {
        const st = actionStatuses[r.id];
        const dotClass = st ? st.status : 'none';
        const dotTitle = st ? st.label : 'No status';
        const linked = getLinkedSite(r.id);
        const isLinking = linkingMode && linkingMode.type === 'site';
        const linkLabel = linked ? '⇄' : (isLinking ? '← link' : '⇄');
        return `
        <a href="${esc(r.url)}" target="_blank" rel="noopener" class="item" data-repo-id="${r.id}" style="text-decoration:none;color:inherit"
           onmouseenter="highlightLinked('repo','${r.id}')" onmouseleave="clearHighlight()">
          <img src="https://icons.duckduckgo.com/ip3/${esc(r.domain)}.ico" width="28" height="28" style="border-radius:var(--radius-sm);flex-shrink:0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
          <div class="item-icon repo" style="display:none">${initials(r.name)}</div>
          <div class="item-info">
            <div class="item-name">${esc(r.name)}${linked ? ' <span class="link-indicator">⇄</span>' : ''}</div>
            <div class="item-url">${esc(r.domain)}</div>
          </div>
          <div class="status-dot ${dotClass}" title="${esc(dotTitle)}"></div>
          <div class="item-actions">
            <button class="setup-btn" title="Generate setup prompt" onclick="event.preventDefault();event.stopPropagation();setupRepo('${r.id}')">Setup</button>
            <button class="item-btn" title="${linked ? 'Unlink' : 'Link to site'}" onclick="startLink('repo','${r.id}',event)">${linkLabel}</button>
            <button class="item-btn" title="Remove" onclick="event.preventDefault();removeRepo('${r.id}')">✕</button>
          </div>
        </a>`;
      }).join('');
    }

    // Render sites
    function renderSites() {
      const el = document.getElementById('site-list');
      document.getElementById('site-count').textContent = state.sites.length;

      if (!state.sites.length) {
        el.innerHTML = '<div class="empty">Paste a site URL below<br>to get started</div>';
        return;
      }

      el.innerHTML = state.sites.map(s => {
        const linked = getLinkedRepo(s.id);
        const isLinking = linkingMode && linkingMode.type === 'repo';
        const linkLabel = linked ? '⇄' : (isLinking ? '← link' : '⇄');
        const favicon = `https://icons.duckduckgo.com/ip3/${esc(s.domain)}.ico`;
        return `
        <a href="${esc(s.url)}" target="_blank" rel="noopener" class="item" data-site-id="${s.id}" style="text-decoration:none;color:inherit"
           onmouseenter="highlightLinked('site','${s.id}')" onmouseleave="clearHighlight()">
          <img src="${favicon}" width="28" height="28" style="border-radius:var(--radius-sm);flex-shrink:0" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
          <div class="item-icon site" style="display:none">${initials(s.name)}</div>
          <div class="item-info">
            <div class="item-name">${esc(s.name)}${linked ? ' <span class="link-indicator">⇄</span>' : ''}</div>
            <div class="item-url">${esc(s.domain)}</div>
          </div>
          <div class="item-actions">
            <button class="item-btn" title="${linked ? 'Unlink' : 'Link to repo'}" onclick="startLink('site','${s.id}',event)">${linkLabel}</button>
            <button class="item-btn" title="Remove" onclick="event.preventDefault();removeSite('${s.id}')">✕</button>
          </div>
        </a>`;
      }).join('');
    }

    // Render prompts
    function renderPrompts() {
      const el = document.getElementById('prompt-list');
      document.getElementById('prompt-count').textContent = state.prompts.length;

      if (!state.prompts.length) {
        el.innerHTML = '<div class="empty">Add prompts to build<br>your quick-copy library</div>';
        return;
      }

      el.innerHTML = state.prompts.map(p => `
        <div class="prompt-item" onclick="copyPrompt('${p.id}', this)">
          <div class="prompt-top">
            <span class="prompt-name">${esc(p.name)}</span>
            <div class="prompt-actions">
              <button class="item-btn" title="Edit" onclick="event.stopPropagation();editPrompt('${p.id}')">✎</button>
              <button class="item-btn" title="Remove" onclick="event.stopPropagation();removePrompt('${p.id}')">✕</button>
            </div>
          </div>
          <div class="prompt-preview">${esc(p.text)}</div>
        </div>
      `).join('');
    }

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    // Add
    function addRepo(url) {
      url = url.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      const repo = { id: uid(), url, name: extractName(url), domain: extractDomain(url) };
      state.repos.push(repo);
      persist(); renderRepos();
      if (ghToken) fetchActionStatus(repo).then(() => renderRepos());
    }

    function addSite(url) {
      url = url.trim();
      if (!url) return;
      if (!url.startsWith('http')) url = 'https://' + url;
      state.sites.push({ id: uid(), url, name: extractName(url), domain: extractDomain(url) });
      persist(); renderSites();
    }

    // Remove
    function removeRepo(id) { state.repos = state.repos.filter(r => r.id !== id); links = links.filter(l => l.repoId !== id); persist(); persistLinks(); renderRepos(); }
    function removeSite(id) { state.sites = state.sites.filter(s => s.id !== id); links = links.filter(l => l.siteId !== id); persist(); persistLinks(); renderSites(); }
    function removePrompt(id) { state.prompts = state.prompts.filter(p => p.id !== id); persist(); renderPrompts(); }

    // Copy prompt
    function copyPrompt(id, el) {
      const p = state.prompts.find(x => x.id === id);
      if (!p) return;
      navigator.clipboard.writeText(p.text);
      const nameEl = el.querySelector('.prompt-name');
      const orig = nameEl.textContent;
      nameEl.innerHTML = '<span class="copy-toast">Copied!</span>';
      setTimeout(() => { nameEl.textContent = orig; }, 1200);
    }

    // Prompt modal
    function openPromptModal() {
      editingPromptId = null;
      document.getElementById('modal-title').textContent = 'New Prompt';
      document.getElementById('prompt-name-input').value = '';
      document.getElementById('prompt-text-input').value = '';
      document.getElementById('prompt-modal').classList.add('active');
      setTimeout(() => document.getElementById('prompt-name-input').focus(), 100);
    }

    function editPrompt(id) {
      const p = state.prompts.find(x => x.id === id);
      if (!p) return;
      editingPromptId = id;
      document.getElementById('modal-title').textContent = 'Edit Prompt';
      document.getElementById('prompt-name-input').value = p.name;
      document.getElementById('prompt-text-input').value = p.text;
      document.getElementById('prompt-modal').classList.add('active');
      setTimeout(() => document.getElementById('prompt-name-input').focus(), 100);
    }

    function closePromptModal() {
      document.getElementById('prompt-modal').classList.remove('active');
      editingPromptId = null;
    }

    function savePrompt() {
      const name = document.getElementById('prompt-name-input').value.trim();
      const text = document.getElementById('prompt-text-input').value.trim();
      if (!name || !text) return;

      if (editingPromptId) {
        const p = state.prompts.find(x => x.id === editingPromptId);
        if (p) { p.name = name; p.text = text; }
      } else {
        state.prompts.push({ id: uid(), name, text });
      }

      persist(); renderPrompts(); closePromptModal();
    }

    // Setup prompt template
    const SETUP_PROMPT_TEMPLATE = `Connect to my GitHub repo and set up the codebase. Make sure it's connected to (branch) successfully and we are accessing the site that the build/deploy published correctly. Changes being made now on will be on most up to date site.\nSend me the live URL (e.g., GitHub Pages link or deploy preview) once you've confirmed it's up.\n\nOnce done say 'We got greensmoke'`;

    // Ensure setup prompt exists in prompts panel
    function ensureSetupPrompt() {
      const existing = state.prompts.find(p => p.name === 'Repo Setup');
      if (!existing) {
        state.prompts.push({ id: uid(), name: 'Repo Setup', text: SETUP_PROMPT_TEMPLATE });
        persist();
        renderPrompts();
      }
    }

    async function fetchMostActiveBranch(ghRepo) {
      if (!ghToken) return null;
      try {
        // Use recent events to find the most recently pushed-to branch
        const evRes = await fetch(`https://api.github.com/repos/${ghRepo}/events?per_page=30`, {
          headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (evRes.ok) {
          const events = await evRes.json();
          // Find most recent PushEvent — its ref is the branch
          for (const ev of events) {
            if (ev.type === 'PushEvent' && ev.payload && ev.payload.ref) {
              const branch = ev.payload.ref.replace('refs/heads/', '');
              return branch;
            }
          }
        }

        // Fallback: check workflow runs for the most recent branch
        const wfRes = await fetch(`https://api.github.com/repos/${ghRepo}/actions/runs?per_page=5`, {
          headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (wfRes.ok) {
          const wfData = await wfRes.json();
          if (wfData.workflow_runs && wfData.workflow_runs.length) {
            return wfData.workflow_runs[0].head_branch;
          }
        }

        return null;
      } catch {
        return null;
      }
    }

    async function setupRepo(repoId) {
      const repo = state.repos.find(r => r.id === repoId);
      if (!repo) return;

      const ghRepo = extractGhRepo(repo.url);
      if (!ghRepo) {
        alert('Not a valid GitHub repo URL');
        return;
      }

      if (!ghToken) {
        openTokenModal();
        return;
      }

      // Show loading state on the button
      const btn = document.querySelector(`[data-repo-id="${repoId}"] .setup-btn`);
      if (btn) { btn.textContent = '...'; btn.classList.add('loading'); }

      const branch = await fetchMostActiveBranch(ghRepo);
      const branchName = branch || 'main';

      // Build the prompt with branch replaced
      const prompt = SETUP_PROMPT_TEMPLATE.replace(/\(branch\)/g, branchName);

      // Copy to clipboard
      await navigator.clipboard.writeText(prompt);

      // Restore button and show feedback with branch name
      if (btn) {
        btn.classList.remove('loading');
        btn.textContent = `✓ ${branchName}`;
        btn.style.color = '#34d399';
        btn.style.borderColor = '#34d39940';
        setTimeout(() => { btn.textContent = 'Setup'; btn.style.color = ''; btn.style.borderColor = ''; }, 2500);
      }

      // Ensure the template prompt is in the prompts panel
      ensureSetupPrompt();
    }

    // GitHub API
    function extractGhRepo(url) {
      try {
        const u = new URL(url);
        if (!u.hostname.includes('github.com')) return null;
        const parts = u.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
        if (parts.length >= 2) return parts[0] + '/' + parts[1];
      } catch {}
      return null;
    }

    async function fetchActionStatus(repo) {
      const ghRepo = extractGhRepo(repo.url);
      if (!ghRepo || !ghToken) {
        actionStatuses[repo.id] = { status: 'none', label: 'Not a GitHub repo' };
        return;
      }
      try {
        const res = await fetch(`https://api.github.com/repos/${ghRepo}/actions/runs?per_page=1`, {
          headers: { Authorization: `token ${ghToken}`, Accept: 'application/vnd.github.v3+json' }
        });
        if (res.status === 404) {
          actionStatuses[repo.id] = { status: 'neutral', label: 'No actions configured' };
          return;
        }
        if (!res.ok) {
          actionStatuses[repo.id] = { status: 'neutral', label: `API error ${res.status}` };
          return;
        }
        const data = await res.json();
        if (!data.workflow_runs || data.workflow_runs.length === 0) {
          actionStatuses[repo.id] = { status: 'neutral', label: 'No workflow runs' };
          return;
        }
        const run = data.workflow_runs[0];
        const conclusion = run.conclusion;
        const status = run.status;
        if (status === 'in_progress' || status === 'queued' || status === 'waiting') {
          actionStatuses[repo.id] = { status: 'pending', label: `${run.name}: ${status}` };
        } else if (conclusion === 'success') {
          actionStatuses[repo.id] = { status: 'success', label: `${run.name}: passed` };
        } else if (conclusion === 'failure') {
          actionStatuses[repo.id] = { status: 'failure', label: `${run.name}: failed` };
        } else {
          actionStatuses[repo.id] = { status: 'neutral', label: `${run.name}: ${conclusion || status}` };
        }
      } catch (err) {
        actionStatuses[repo.id] = { status: 'neutral', label: 'Network error' };
      }
    }

    async function refreshAllStatuses() {
      if (!ghToken) return;
      await Promise.all(state.repos.map(r => fetchActionStatus(r)));
      renderRepos();
    }

    function updateGhUI() {
      const statusEl = document.getElementById('gh-status');
      const btnEl = document.getElementById('gh-btn');
      if (ghToken) {
        statusEl.textContent = 'connected';
        statusEl.className = 'gh-status connected';
        btnEl.textContent = 'GitHub';
      } else {
        statusEl.textContent = '';
        statusEl.className = 'gh-status';
        btnEl.textContent = 'Connect GitHub';
      }
    }

    // Token modal
    function openTokenModal() {
      document.getElementById('token-input').value = ghToken ? '••••••••••••••••' : '';
      document.getElementById('gh-disconnect-btn').style.display = ghToken ? 'block' : 'none';
      document.getElementById('token-modal').classList.add('active');
      if (!ghToken) setTimeout(() => document.getElementById('token-input').focus(), 100);
    }

    function closeTokenModal() {
      document.getElementById('token-modal').classList.remove('active');
    }

    function saveToken() {
      const val = document.getElementById('token-input').value.trim();
      if (!val || val.startsWith('••')) { closeTokenModal(); return; }
      ghToken = val;
      localStorage.setItem('dt_gh_token', ghToken);
      updateGhUI();
      closeTokenModal();
      refreshAllStatuses();
    }

    function disconnectGitHub() {
      ghToken = '';
      localStorage.removeItem('dt_gh_token');
      Object.keys(actionStatuses).forEach(k => delete actionStatuses[k]);
      updateGhUI();
      renderRepos();
      closeTokenModal();
    }

    // Theme
    function getTheme() { return localStorage.getItem('dt_theme') || 'dark'; }
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('theme-toggle').innerHTML = t === 'dark' ? '&#9790;' : '&#9728;';
    }
    function toggleTheme() {
      const t = getTheme() === 'dark' ? 'light' : 'dark';
      localStorage.setItem('dt_theme', t);
      applyTheme(t);
    }
    applyTheme(getTheme());

    // Linking repos <-> sites
    // Links stored as { repoId, siteId } in localStorage
    let links = JSON.parse(localStorage.getItem('dt_links') || '[]');
    function persistLinks() { localStorage.setItem('dt_links', JSON.stringify(links)); }

    let linkingMode = null; // { type: 'repo'|'site', id: string }

    function startLink(type, id, event) {
      event.preventDefault();
      event.stopPropagation();
      // If already linked, unlink
      const existing = links.find(l => l[type + 'Id'] === id);
      if (existing) {
        links = links.filter(l => l !== existing);
        persistLinks();
        linkingMode = null;
        renderRepos(); renderSites();
        return;
      }
      if (linkingMode && linkingMode.type !== type) {
        // Complete the link
        const link = {};
        link[linkingMode.type + 'Id'] = linkingMode.id;
        link[type + 'Id'] = id;
        // Remove any existing links for either item
        links = links.filter(l => l.repoId !== link.repoId && l.siteId !== link.siteId);
        links.push(link);
        persistLinks();
        linkingMode = null;
        renderRepos(); renderSites();
      } else {
        linkingMode = { type, id };
        renderRepos(); renderSites();
      }
    }

    function getLinkedSite(repoId) {
      const l = links.find(x => x.repoId === repoId);
      return l ? l.siteId : null;
    }

    function getLinkedRepo(siteId) {
      const l = links.find(x => x.siteId === siteId);
      return l ? l.repoId : null;
    }

    function highlightLinked(type, id) {
      document.querySelectorAll('.linked-highlight').forEach(el => el.classList.remove('linked-highlight'));
      if (type === 'repo') {
        const siteId = getLinkedSite(id);
        if (siteId) {
          const el = document.querySelector(`[data-site-id="${siteId}"]`);
          if (el) el.classList.add('linked-highlight');
        }
      } else {
        const repoId = getLinkedRepo(id);
        if (repoId) {
          const el = document.querySelector(`[data-repo-id="${repoId}"]`);
          if (el) el.classList.add('linked-highlight');
        }
      }
    }

    function clearHighlight() {
      document.querySelectorAll('.linked-highlight').forEach(el => el.classList.remove('linked-highlight'));
    }

    // Input listeners
    document.getElementById('repo-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { addRepo(e.target.value); e.target.value = ''; }
    });

    document.getElementById('site-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') { addSite(e.target.value); e.target.value = ''; }
    });

    // Close modal on overlay click
    document.getElementById('prompt-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closePromptModal();
    });
    document.getElementById('token-modal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeTokenModal();
    });

    // Escape key closes modals
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closePromptModal(); closeTokenModal(); }
    });

    // Init
    ensureSetupPrompt();
    renderRepos();
    renderSites();
    renderPrompts();
    updateGhUI();
    refreshAllStatuses();
  </script>
</body>
</html>
